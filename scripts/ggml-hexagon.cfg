[general]
#version of ggml-hexagon
version = "0.99.3.4"

#enable/disable dump diag info for troubleshooting issues on AP side
#0 = disable
#1 = enable
dump_debug_info = 0

#offload ggml op to Hexagon cDSP directly
[cdsp]

#number of Hexagon devices (PDs) to use
#1  = single device (default, one cDSP PD on domain 3)
#2+ = multi-device, each additional device reserves a new PD via FASTRPC_RESERVE_NEW_SESSION
#can be overridden by GGML_HEXAGON_NDEV env var
ndev = 1

#enable/disable multi-threading on cDSP side
# 1    disable multi-threading on cDSP side
# 2-8  thread_counts on cDSP side
thread_counts = 6

#minimum N (batch size) to offload quantized MUL_MAT to DSP
mulmat_min_n = 30

#offload type on AP side
# 0 = per-op (debug, each op = one FastRPC call)
# 1 = FastRPC-based op-batch (support has been removed)
# 2 = ION-based op-batch (production, data via ion shared memory)
offload_cgraph_type = 2

#enable/disable dump diag info for troubleshooting issues on cDSP side
#0 = disable
#1 = enable
dump_diag_info = 0

#enable/disable HVX-optimized quantize_row & vec_dot & dequantize-to-tiles
#0 = generic
#1 = HVX-optimize
ggml_dsp_use_hvx = 1

#ION cache coherency mode for AP <-> DSP data transfer
# 0 = both (DC CVAC/CIVAC + DMA_BUF_IOCTL_SYNC)
# 1 = ion_sync only (skip manual DC CVAC/CIVAC, rely on kernel DMA_BUF_IOCTL_SYNC)
# 2 = DC CVAC/CIVAC only (skip ion_sync, manual cache maintenance only)
ion_sync_mode = 0

#algorithm type of mulmat on cDSP side.
#Selects BOTH the dispatch path in entry.c AND the mulmat kernel variant.
#
#Dual-channel dispatch in entry.c (applies to per-op and ION-batch paths):
#  == 29               Qualcomm execute_op path. Full op coverage (see enabled_ops).
#  != 29               Self-built ggmlop_dsp_* kernels. Limited op set:
#                       ADD,SUB,MUL,DIV,MUL_MAT,RMS_NORM,ROPE,SOFT_MAX,UNARY,
#                       SCALE,CPY,CONCAT,REPEAT,DIAG_MASK_INF,FLASH_ATTN_EXT.
#                       Ops outside this list return AEE_EUNSUPPORTED and corrupt
#                       inference - trim enabled_ops to match when algotype != 29.
#
#Mulmat kernel variants (only used by self-built path, algotype != 29):
#  0  = HVX + multithread
#  30 = HMX sync + x4x2 repack (AP-side repack Q4_0->x4x2, faster HVX dequantization)
#  31 = sgemm (llamafile-style)
#  32 = HMX pipeline (DMA + HVX + HMX 3-stage pipeline with double buffer, async HMX via hmx_queue)
#  33 = HVX + VTCM + multithread
#  29 = Qualcomm execute_op (delegates to ../htp/*.c; ignores kernel variants above)
mulmat_algotype = 29

#comma-separated list of weight types to offload for MUL_MAT (empty = all supported types)
#example: enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,F16
#use this to selectively enable/disable specific quantized types without recompilation
#F32 is always allowed
#enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,MXFP4
enabled_types = F32,F16,Q4_0,Q8_0,Q4_1,IQ4_NL,MXFP4

#comma-separated list of ops to offload to cDSP (empty = all supported ops)
#example: enabled_ops = MUL_MAT,ADD,RMS_NORM,SILU,SOFT_MAX,SCALE,MUL,SUB,RESHAPE,PERMUTE,TRANSPOSE,CONT,VIEW,REPEAT
#use this to selectively enable/disable ops without recompiling
#ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,DIV,REPEAT,SOFT_MAX

#for mulmat_algotype!=29 & mulmat_algotype=29
enabled_ops = MUL_MAT,ADD,SUB,MUL,DIV,UNARY,SCALE,CONCAT,DIAG_MASK_INF,REPEAT,SOFT_MAX

#for mulmat_algotype=29 (Qualcomm execute_op forces all ops)
#enabled_ops = ADD,SUB,MUL,DIV,MUL_MAT,RMS_NORM,ROPE,SOFT_MAX,UNARY,SCALE,CONCAT,CPY,GET_ROWS,SET_ROWS,SUM_ROWS,CONT,FLASH_ATTN_EXT,GLU,NORM,L2_NORM,SQR,SQRT,ARGSORT,PAD,CUMSUM,FILL,DIAG,TRI,REPEAT,DIAG_MASK_INF
