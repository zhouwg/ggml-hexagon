[general]
#version of ggml-hexagon
version = "0.99.3"

#enable/disable offload quantized type mulmat
#the default value is 0
enable_q_mulmat = 1

# enable/disable print tensors info in op function
print_tensors_info = 0
# enable/disable dump op info in handle_op
dump_op_info = 0

# enable/disable perf of op function
# this is the default setting
enable_perf = 0

# enable/disable profiler feature to visualize cDSP NPU performance
# this is default setting
enable_profiler = 0
#threshold duration of NPU performance profiler, per seconds
profiler_duration = 5
#threshold counst of NPU performance profiler
profiler_counts = 200
#attention:
#          NPU performance might be slower when enable_profiler = 1 because of file I/O in this feature;
#          ensure enable_perf = 1 when set enable_profiler = 1;

#offload ggml op to Hexagon cDSP directly
[cdsp]

#number of Hexagon devices (PDs) to use
#1  = single device (default, one cDSP PD on domain 3)
#2+ = multi-device, each additional device reserves a new PD via FASTRPC_RESERVE_NEW_SESSION
#can be overridden by GGML_HEXAGON_NDEV env var
ndev = 1

#enable/disable multi-threading on cDSP side
# 1    disable multi-threading on cDSP side
# 2-8  thread_counts on cDSP side
thread_counts = 6

#minimum N (batch size) to offload quantized MUL_MAT to DSP
#for N <= mulmat_min_n (decode/small PP), CPU ARM NEON SDOT is faster
#for N > mulmat_min_n (large PP), DSP HMX pipeline is efficient
#32 = one full HMX tile column (recommended default)
#0 = offload all MUL_MAT to DSP (for GEMV testing on N=1)
mulmat_min_n = 30

#offload type on AP side
# 0 = per-op (debug, each op = one FastRPC call)
# 1 = FastRPC-based op-batch (support has been removed)
# 2 = ION-based op-batch (production, data via ion shared memory)
offload_cgraph_type = 2

#enable/disable dump diag info for troubleshooting issues on cDSP side
#0 = disable
#1 = enable
dump_diag_info = 0

#enable/disable HVX-optimized quantize_row & vec_dot & dequantize-to-tiles
#0 = generic
#1 = HVX-optimize
ggml_dsp_use_hvx = 1

#algorithm type of mulmat on cDSP side
#30 = HMX sync + x4x2 repack (AP-side repack Q4_0->x4x2, faster HVX dequantization)
#31 = sgemm
#32 = HMX pipeline (DMA + HVX + HMX 3-stage pipeline with double buffer, async HMX via hmx_queue)
#33 = HVX + VTCM + multithread
#0  = HVX + multithread
mulmat_algotype = 32

#comma-separated list of weight types to offload for MUL_MAT (empty = all supported types)
#example: enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,F16
#use this to selectively enable/disable specific quantized types without recompilation
#F32 is always allowed
#enabled_types = Q4_0,Q4_1,Q5_0,Q8_0,IQ4_NL,BF16,MXFP4
enabled_types = all

#comma-separated list of ops to offload to cDSP (empty = all supported ops)
#example: enabled_ops = MUL_MAT,ADD,RMS_NORM,SILU,SOFT_MAX,SCALE,MUL,SUB,RESHAPE,PERMUTE,TRANSPOSE,CONT,VIEW,REPEAT
#use this to selectively enable/disable ops without recompiling
#ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT
#not ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,MUL
#not ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,RMS_NORM
#ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,DIV,REPEAT,SOFT_MAX,FLASH_ATTN_EXT
enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,DIV,REPEAT,SOFT_MAX
#not ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,SOFT_MAX,MUL
#not ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,SOFT_MAX,RMS_NORM
#not ok
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,SOFT_MAX,RMS_NORM,MUL
#enabled_ops = MUL_MAT,ADD,SUB,UNARY,SCALE,CONCAT,DIAG_MASK_INF,CPY,DIV,REPEAT,SOFT_MAX,RMS_NORM,MUL
